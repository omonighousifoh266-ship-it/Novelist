<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novel Haven</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #101018;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 22px;
            background: #191925;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            color: #a78bfa;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
        }

        .hero {
            padding: 55px 20px;
            text-align: center;
        }

        .hero h1 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        .hero p {
            color: #aaa;
            margin-bottom: 20px;
        }

        .search {
            padding: 13px;
            width: 90%;
            max-width: 400px;
            border: none;
            border-radius: 8px;
        }

        .books {
            padding: 20px;
        }

        .books h2 {
            margin-bottom: 20px;
        }

        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 18px;
        }

        .book {
            background: #20202e;
            padding: 12px;
            border-radius: 10px;
        }

        .book img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            border-radius: 7px;
        }

        .book h3 {
            margin: 10px 0 5px;
        }

        .book p {
            color: #aaa;
            font-size: 13px;
        }

        .book button {
            margin-top: 12px;
            padding: 10px;
            width: 100%;
            background: #8b5cf6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #888;
        }
    </style>
</head>

<body>

    <header>
        <h2>Novel Haven</h2>

        <nav>
            <a href="#">Home</a>
            <a href="#books">Novels</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Enter a World of Stories</h1>
        <p>Discover amazing novels and enjoy every chapter.</p>

        <input
            class="search"
            type="text"
            placeholder="Search for a novel..."
            id="search"
            oninput="searchBooks()"
        >
    </section>

    <section class="books" id="books">
        <h2>Featured Novels</h2>

        <div class="book-grid" id="bookGrid">

            <div class="book">
                <img src="https://placehold.co/300x400/292044/ffffff?text=Novel+One" alt="Novel One cover">
                <h3>Novel One</h3>
                <p>Author: Your Name</p>
                <button onclick="readNovel('Novel One')">Read Novel</button>
            </div>

            <div class="book">
                <img src="https://placehold.co/300x400/292044/ffffff?text=Novel+Two" alt="Novel Two cover">
                <h3>Novel Two</h3>
                <p>Author: Your Name</p>
                <button onclick="readNovel('Novel Two')">Read Novel</button>
            </div>

            <div class="book">
                <img src="https://placehold.co/300x400/292044/ffffff?text=Novel+Three" alt="Novel Three cover">
                <h3>Novel Three</h3>
                <p>Author: Your Name</p>
                <button onclick="readNovel('Novel Three')">Read Novel</button>
            </div>

        </div>
    </section>

    <footer>
        <p>© 2026 Novel Haven. All rights reserved.</p>
    </footer>

    <script>
        function readNovel(title) {
            alert("You selected " + title);
        }

        function searchBooks() {
            const search = document.getElementById("search").value.toLowerCase();
            const books = document.querySelectorAll(".book");

            books.forEach(book => {
                const title = book.querySelector("h3").textContent.toLowerCase();
                book.style.display = title.includes(search) ? "block" : "none";
            });
        }
    </script>

</body>
  </html>
